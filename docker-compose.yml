services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elecsense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elecsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w api"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/elecsense
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w web -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  api-node-modules:
  web-node-modules:
